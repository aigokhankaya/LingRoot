
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LingRoot AI</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6366f1",
              "primary-dark": "#4f46e5",
              "background-light": "#f8fafc",
              "background-dark": "#0f172a",
              "surface-light": "rgba(255, 255, 255, 0.7)",
              "surface-dark": "rgba(30, 41, 59, 0.7)",
              "accent-violet": "#8b5cf6",
              "accent-orange": "#f97316",
              "accent-indigo": "#6366f1",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              'xl': '1.5rem',
              '2xl': '2rem',
              '3xl': '2.5rem',
            },
            boxShadow: {
              'glass': '0 8px 32px 0 rgba(99, 102, 241, 0.07)',
              'glow': '0 0 20px rgba(99, 102, 241, 0.5)',
            },
          },
        },
      };
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .glass {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .app-bg {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.4;
            pointer-events: none;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        @keyframes soft-float {
            0%, 100% { transform: translateZ(20px) translateY(0); }
            50% { transform: translateZ(20px) translateY(-12px); }
        }
        @keyframes sound-wave {
            0% { transform: scale(0.5); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .animate-float {
            animation: float 10s infinite ease-in-out;
        }
        .animate-soft-float {
            animation: soft-float 3s ease-in-out infinite;
        }
        .animate-sound-wave {
            animation: sound-wave 2s infinite ease-out;
        }
        @keyframes slide-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
