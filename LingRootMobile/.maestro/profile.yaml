appId: com.lingroot.mobile
---
# LingRoot Mobile - Profile Screen Flow
# Tests profile page and settings

# 1. Launch app
- launchApp:
    clearState: false

# 2. Wait for app to load
- waitForAnimationToEnd:
    timeout: 10000

# 3. Navigate to Profile tab
- tapOn:
    text: "/Profil|Profile/"
    optional: true

- waitForAnimationToEnd:
    timeout: 5000

# 4. Verify profile elements
- assertVisible:
    text: "/Profil|Profile/"
    optional: true

# 5. Check for user info section
- assertVisible:
    text: "/E-posta|Email|@/"
    optional: true

# 6. Check for settings option
- assertVisible:
    text: "/Ayarlar|Settings|Hesap|Account/"
    optional: true

# 7. Navigate to settings if available
- tapOn:
    text: "/Ayarlar|Settings/"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

# 8. Check settings options
- assertVisible:
    text: "/Bildirimler|Notifications|Dil|Language|Tema|Theme/"
    optional: true

# 9. Go back to profile
- back

# 10. Check for membership info
- assertVisible:
    text: "/Üyelik|Membership|Plan|Premium|Free/"
    optional: true

# 11. Check for logout option
- assertVisible:
    text: "/Çıkış|Logout|Sign Out/"
    optional: true

# 12. Test complete
- takeScreenshot: profile_result
