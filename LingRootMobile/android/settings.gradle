pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
  // Resolve React Native Gradle plugin directly from node_modules
  def rnGradlePluginPath = new File(rootDir, "../node_modules/@react-native/gradle-plugin").absolutePath
  if (new File(rnGradlePluginPath).exists()) {
    includeBuild(rnGradlePluginPath)
  }
}

plugins {
  id("com.facebook.react.settings")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'lingrootmobile'
include ':app'
