// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle:8.8.2')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.0')
    // React Native Gradle Plugin is included via settings.gradle includeBuild
    classpath('com.google.gms:google-services:4.4.2')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Project-wide Android config
ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 35
    ndkVersion = "27.1.12297006"
    // Some third-party libraries (e.g., react-native-documents_picker) read Kotlin version
    // from a Gradle property. Expose both common variants to be safe.
    kotlin_version = '2.0.0'
    kotlinVersion = '2.0.0'
}

