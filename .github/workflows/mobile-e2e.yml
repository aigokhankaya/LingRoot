name: Mobile E2E Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'LingRootMobile/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'LingRootMobile/**'
  workflow_dispatch:

jobs:
  maestro-test:
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'LingRootMobile/package-lock.json'

      - name: Install Dependencies
        working-directory: LingRootMobile
        run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Build the Android App (Debug)
      # This step can be time consuming.
      - name: Build Android App
        working-directory: LingRootMobile/android
        run: ./gradlew assembleDebug

      # Run Maestro Tests on Android Emulator
      - name: Run Maestro Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          script: |
            # Install the app
            adb install LingRootMobile/android/app/build/outputs/apk/debug/app-debug.apk
            
            # Run the flow
            $HOME/.maestro/bin/maestro test LingRootMobile/.maestro/login.yaml
            $HOME/.maestro/bin/maestro test LingRootMobile/.maestro/register.yaml
            $HOME/.maestro/bin/maestro test LingRootMobile/.maestro/smoke.yaml
