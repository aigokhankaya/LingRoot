# Nginx Reverse Proxy Configuration for LingRoot VDS
# Place at: /etc/nginx/sites-available/lingroot-vds.conf
# Enable:  ln -s /etc/nginx/sites-available/lingroot-vds.conf /etc/nginx/sites-enabled/
#
# Domains:
#   signoz.lingroot.com  → SigNoz UI (localhost:8080)
#   otel.lingroot.com    → OTel Collector HTTP (localhost:4318)
#   mfa.lingroot.com     → MFA Service (localhost:5002)
#
# SSL: Let's Encrypt via certbot
#   sudo certbot --nginx -d signoz.lingroot.com -d otel.lingroot.com -d mfa.lingroot.com
#   Certbot will automatically add SSL server blocks and redirect.

# ─── Rate limiting zones ───
limit_req_zone $binary_remote_addr zone=otel_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=mfa_limit:10m rate=10r/s;

# ═══════════════════════════════════════════════════════
# SigNoz UI — signoz.lingroot.com
# ═══════════════════════════════════════════════════════
server {
    listen 80;
    server_name signoz.lingroot.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (SigNoz live tail)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ═══════════════════════════════════════════════════════
# OTel Collector HTTP — otel.lingroot.com
# ═══════════════════════════════════════════════════════
server {
    listen 80;
    server_name otel.lingroot.com;

    # Rate limit: 100 req/s with burst of 200
    limit_req zone=otel_limit burst=200 nodelay;

    # Max body size for telemetry payloads
    client_max_body_size 10m;

    location /v1/traces {
        proxy_pass http://127.0.0.1:4318/v1/traces;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/logs {
        proxy_pass http://127.0.0.1:4318/v1/logs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/metrics {
        proxy_pass http://127.0.0.1:4318/v1/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Block all other paths
    location / {
        return 404;
    }
}

# ═══════════════════════════════════════════════════════
# MFA Service — mfa.lingroot.com
# ═══════════════════════════════════════════════════════
server {
    listen 80;
    server_name mfa.lingroot.com;

    # Rate limit: 10 req/s with burst of 20
    limit_req zone=mfa_limit burst=20 nodelay;

    # MFA uploads: audio files up to 50MB
    client_max_body_size 50m;

    # Timeouts for long-running alignment jobs
    proxy_connect_timeout 30s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
