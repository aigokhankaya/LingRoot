services:
  - type: web
    name: lingloops-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        value: aws-0-eu-central-1.pooler.supabase.com
      - key: DB_PORT
        value: 6543
      - key: DB_USER
        value: postgres.ffqfcmmbeeieouoghrac
      - key: DB_NAME
        value: postgres
      - key: DB_PASS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 3650d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 3650d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      # Video Factory internal API (POST /internal/video-level-package)
      - key: VIDEO_FACTORY_API_KEY
        sync: false
      - key: OPENAI_VIDEO_FACTORY_MODEL
        value: gpt-4o
